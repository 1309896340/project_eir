[project]
name = "rnadesign"
version = "0.1.0"
description = "mRNA sequence design: codon optimization and analysis tooling"
# 上限 <3.13:codontransformer 依赖 numpy<2.0,而 numpy 1.26.x 的 wheel 只发布到 cp312
requires-python = ">=3.12,<3.13"
dependencies = [
    "biopython>=1.88",
    "codontransformer>=1.6.7",
    # torch 走默认 PyPI 源的 CPU 轮子,设备无关(任何机器 `uv sync` 均可安装)。
    # 显式声明直接依赖以便统一控制版本范围;GPU 版如需启用,再按机器单独配置
    # [[tool.uv.index]] explicit 源(如 mirror.sjtu.edu.cn/pytorch-wheels/cu126)+ [tool.uv.sources]
    "esm>=3.2.3",
    "fastapi>=0.141.1",
    "gradio>=6.17.3",
    "openmm[cuda13]>=8.6.1",
    "pdbfixer>=1.12.0",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "torch>=2.12.1,<3.0",
    "uvicorn[standard]>=0.53.0",
]

# 默认包源:阿里云 PyPI 镜像(等价 pip -i https://mirrors.aliyun.com/pypi/simple/)
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]

# pyright 严格类型检查(第一方代码)。
# 第三方科学计算库(Bio.PDB/openmm/esm 等)类型存根不全,
# Unknown 相关规则降为 warning/none,其余规则保持 strict。
[tool.pyright]
include = ["ProteinFolding", "scripts", "tests"]
exclude = [
    "**/__pycache__",
    "ProteinFolding/frontend/vendor",
    "ProteinFolding/data",
    "ProteinFolding/output",
    "CodonTransformer/data",
]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"
reportUnknownParameterType = "warning"
reportMissingParameterType = "warning"
reportUntypedFunctionDecorator = "warning"
reportUntypedClassDecorator = "warning"
reportUntypedBaseClass = "warning"
